[project]
name = "rag-hotel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "surybang", email = "hos.fabien@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "langdetect>=1.0.9",
    "pandas>=3.0.5",
    "pypdf>=6.14.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.1",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[project.scripts]
rag-hotel = "rag_hotel:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
